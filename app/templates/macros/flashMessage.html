{% macro flash_messages(messages, category="info") %}
    {% if messages %}
        <div id="messages" role="status" aria-live="polite" aria-atomic="true">
            {% for category, message in messages %}
                <div class="message {{ category }}">
                    {{ message }}
                    <button type="button" class="close-button" aria-label="Close message">
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                    </button>
                </div>
            {% endfor %}
        </div>
    {% endif %}
{% endmacro %}
